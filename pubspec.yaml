name: cyns
description: "CYN - Chase Your Needs: Skilled-worker hiring and service-provider platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.1.0

  # State Management
  provider: ^6.1.2

  # Local Storage & Preferences
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Location & Maps (fully open-source — no paid API keys)
  geolocator: ^13.0.1

  # UI Components & Media
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  flutter_polyline_points: ^2.1.0
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.1
  audioplayers: ^6.8.1
  record: ^7.1.1
  agora_token_generator: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
