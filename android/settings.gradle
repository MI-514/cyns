pluginManagement {
    try {
        def pe = java.lang.Class.forName("java.lang.ProcessEnvironment")
        ["theEnvironment", "theUnmodifiableEnvironment", "theCaseInsensitiveEnvironment"].each { fieldName ->
            try {
                def f = pe.getDeclaredField(fieldName)
                f.setAccessible(true)
                def map = f.get(null)
                if (map != null) {
                    map.remove("ANDROID_PREFS_ROOT")
                    map.remove("android_prefs_root")
                }
            } catch (ignored) {}
        }
    } catch (ignored) {}

    def flutterSdkPath = {
        def properties = new java.util.Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
